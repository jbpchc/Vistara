# Render Blueprint: deploys the Vistara API. The web app stays on GitHub Pages.
# Render dashboard → New → Blueprint → pick this repo. Values marked sync:false are asked for once.
services:
  - type: web
    name: vistara-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: vistara
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # GitHub Pages origin (no path). Add more origins separated by commas.
      - key: FRONTEND_URL
        value: https://jbpchc.github.io
      # Creates the demo accounts on the first start with an empty database.
      - key: SEED_ON_START
        value: "true"
