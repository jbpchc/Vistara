# Deploys the frontend to GitHub Pages: live mode if VITE_API_BASE_URL is set, demo mode otherwise.
# Live URL: https://jbpchc.github.io/Vistara/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Live mode when the repo variable VITE_API_BASE_URL is set (Settings → Secrets and variables
      # → Actions → Variables), e.g. https://vistara-api.onrender.com/api. Otherwise demo mode.
      - name: Build (served from /Vistara/)
        run: npx vite build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEMO: ${{ vars.VITE_API_BASE_URL == '' && 'true' || 'false' }}
          VITE_QUICK_LOGIN: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA rewrites: serve index.html for deep links like /Vistara/admin/dashboard
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
